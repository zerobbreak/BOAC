# Railway config for the backend (api) service.
# Service settings: Root Directory = /backend. Railway reads this file from there.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"
watchPatterns = ["/backend/**"]

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/"
healthcheckTimeout = 30
