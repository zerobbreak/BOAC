# Railway config for the frontend service.
# Service settings: Root Directory = / (repo root, because the Dockerfile copies backend/src for the typed client)
# and Config File Path = /frontend/railway.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "frontend/Dockerfile"
watchPatterns = ["frontend/**", "backend/src/**", "backend/package*.json", "backend/tsconfig.json"]

[deploy]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/"
healthcheckTimeout = 30
