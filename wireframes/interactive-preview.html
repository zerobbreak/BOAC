<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bokwidi Old Age Centre (BOAC) — Interactive Responsive Wireframes (Task 2.1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-navy: #0f2a4a;
      --brand-amber: #e69500;
      --brand-green: #2e7d32;
      --brand-cream: #fdfbf7;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --card-bg: #ffffff;
      --highlight: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b192c;
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Wireframe Controller */
    .control-header {
      background: #0f2a4a;
      border-bottom: 2px solid var(--brand-amber);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: white;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--brand-amber);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .toolbar-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-group {
      display: flex;
      background: #1e3a5f;
      border-radius: 8px;
      padding: 3px;
    }

    .btn-tab {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tab.active {
      background: var(--brand-amber);
      color: #000000;
      font-weight: 700;
    }

    /* Viewport Stage */
    .stage-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, #1e3a5f 0%, #08111e 80%);
      overflow-y: auto;
    }

    .viewport-frame {
      background: var(--brand-cream);
      border: 3px solid #334155;
      border-radius: 14px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      max-width: 1400px;
      min-height: 840px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewport-frame.mode-tablet {
      max-width: 820px;
    }

    .viewport-frame.mode-mobile {
      max-width: 390px;
      border-radius: 36px;
      border: 10px solid #1e293b;
      min-height: 800px;
    }

    /* Embedded Web UI Elements */
    .web-header {
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .web-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--brand-navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .web-nav {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .mode-tablet .web-nav, .mode-mobile .web-nav {
      display: none;
    }

    .btn-donate-cta {
      background: var(--brand-amber);
      color: #000;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    .web-main {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .mode-mobile .web-main {
      padding: 16px;
      padding-bottom: 72px;
    }

    /* Mobile Bottom Navigation */
    .mobile-nav-bar {
      display: none;
      position: sticky;
      bottom: 0;
      background: #ffffff;
      border-top: 2px solid #e2e8f0;
      padding: 8px 12px;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .mode-mobile .mobile-nav-bar {
      display: flex;
    }

    .mnav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      gap: 2px;
    }

    .mnav-item.active {
      color: var(--brand-navy);
    }

    /* Cards & Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mode-tablet .grid-3, .mode-tablet .grid-4 {
      grid-template-columns: 1fr 1fr;
    }

    .mode-mobile .grid-2, .mode-mobile .grid-3, .mode-mobile .grid-4 {
      grid-template-columns: 1fr;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-box {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e3a5f 100%);
      color: #ffffff;
      border-radius: 14px;
      padding: 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-badge {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--brand-navy);
    }

    .btn-action-primary {
      background: var(--brand-green);
      color: #ffffff;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Toast Notification */
    #toast-msg {
      visibility: hidden;
      min-width: 250px;
      background-color: #2e7d32;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 14px;
      position: fixed;
      z-index: 2000;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #toast-msg.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.3s 2.5s;
    }

    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
  </style>
</head>
<body>

  <!-- Top Controller Bar -->

    <div class="brand-title">
      <span>Bokwidi Old Age Centre (BOAC)</span>
      <span class="brand-badge">Task 2.1 Wireframes</span>
    </div>

    <!-- Screen Navigator -->
    <div class="toolbar-group">

          <span>Portal</span>
        </div>
      </nav>

  </main>
